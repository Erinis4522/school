name: Create classroom short link

on:
  push:
    branches: [main]
    paths: [".github/workflows/ai-lab-shortlink.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create custom short link at zip1.io
        shell: bash
        run: |
          set -e
          curl -sS -L -D /tmp/headers -o /tmp/result \
            --max-time 35 \
            -X POST 'https://zip1.io/api/create' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://erinis4522.github.io/school/ai-lab/","alias":"aisw26"}'
          head -n 3 /tmp/headers
          cat /tmp/result
          echo
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/result"))
          print("Creation result:", data)
          if data.get("short_url") != "https://zip1.io/aisw26":
              raise SystemExit("Short URL could not be created")
          PY
      - name: Verify redirect points to the classroom game
        shell: bash
        run: |
          set -e
          curl -sS -I --max-time 20 "https://zip1.io/aisw26" > /tmp/redirect
          head -n 20 /tmp/redirect
          grep -i -E '^location: https://erinis4522.github.io/school/ai-lab/?' /tmp/redirect
