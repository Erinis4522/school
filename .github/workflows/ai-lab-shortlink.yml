name: Create classroom short link

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ai-lab-shortlink.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Create or inspect classroom short link
        shell: bash
        run: |
          set -e
          curl -sSL -D /tmp/headers -o /tmp/body --max-time 30 --get \
            --data-urlencode "format=json" \
            --data-urlencode "url=https://erinis4522.github.io/school/ai-lab/" \
            --data-urlencode "shorturl=aisw26" \
            "https://is.gd/create.php"
          echo "Response headers:"
          head -n 15 /tmp/headers
          echo "Response body:"
          head -c 1200 /tmp/body
          echo
          python3 - <<'PY'
          import json
          payload = open("/tmp/body", encoding="utf-8").read()
          try:
              data = json.loads(payload)
          except ValueError:
              raise SystemExit("Short link API did not return JSON; see response above")
          print("Result:", data)
          if data.get("shorturl") != "https://is.gd/aisw26":
              raise SystemExit("Short link was not created")
          PY
