name: Create classroom short link

on:
  push:
    branches: [main]
    paths: [".github/workflows/ai-lab-shortlink.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - name: Check published classroom game
        run: |
          curl -sSIL --max-time 20 "https://erinis4522.github.io/school/ai-lab/" | head -n 14
      - name: Look up is.gd address and try is.gd or v.gd
        shell: bash
        run: |
          set +e
          for url in \
            "https://is.gd/forward.php?format=json&shorturl=aisw26" \
            "https://v.gd/forward.php?format=json&shorturl=aisw26" \
            "https://v.gd/create.php?format=json&url=https%3A%2F%2Ferinis4522.github.io%2Fschool%2Fai-lab%2F&shorturl=aisw26" ; do
            echo "Checking: $url"
            curl -LsS --max-time 25 -D /tmp/h -o /tmp/b "$url"
            head -n 4 /tmp/h
            head -c 800 /tmp/b
            echo
          done
